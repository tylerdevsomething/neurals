# Checks the hosted devnet services every 15 minutes. A failed run emails the repository owner
# (GitHub notifies whoever last changed this schedule), listing every problem found.
name: monitor
# Paused 2026-11-11: the devnet site is taken down. After the launch, point --site at the mainnet
# site and put the schedule back.
on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/monitor.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/monitor.ts --site https://neurals-production.up.railway.app
